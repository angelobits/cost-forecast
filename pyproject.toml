[project]
name = "cost-forecast"
version = "0.1.0"
description = "Estimación y proyección de costos de equipos de construcción a partir de precios de materias primas (X, Y, Z)"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Angelo Parra Cortez" }]

dependencies = [
    "pandas>=2.1",
    "numpy>=1.26",
    "scipy>=1.11",
    "statsmodels>=0.14",
    "scikit-learn>=1.4",
    "matplotlib>=3.8",
    "pyyaml>=6.0",
    "tabulate>=0.9",
]

[project.optional-dependencies]
agent = [
    "langgraph>=0.2",
    "langchain-anthropic>=0.2",
    "langchain-core>=0.3",
    "anthropic>=0.40",
    "requests>=2.31",
]
ui = [
    "streamlit>=1.30",
]
api = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "black>=24.0",
    "nbconvert>=7.0",
    "ipykernel>=6.0",
    "httpx>=0.27",
]

[project.scripts]
cost-forecast = "cost_forecast.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cost_forecast"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]
ignore = ["E501"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.uv]
package = true